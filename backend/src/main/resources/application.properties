spring.application.name=barcode-to-qr
server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Comma-separated list, e.g. https://barkod.example.com,https://www.barkod.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator - only expose health/info by default; add "metrics" etc. explicitly if needed
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.com.example.barcodeconverter=${LOG_LEVEL:INFO}
