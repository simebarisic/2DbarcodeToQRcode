# Production variant: pulls prebuilt images from GHCR (pushed by CI on
# every merge to main / version tag) instead of building locally.
#
# Usage on a server:
#   1. Copy this file + .env (see .env.example) to the server.
#   2. docker compose -f docker-compose.prod.yml pull
#   3. docker compose -f docker-compose.prod.yml up -d
#
# GHCR_OWNER/GHCR_REPO come from your GitHub repo, e.g. for
# github.com/sime/barcode-to-qr -> GHCR_OWNER=sime, GHCR_REPO=barcode-to-qr

services:
  backend:
    mem_limit: 1g
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-backend:${IMAGE_TAG:-main}
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3070}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    mem_limit: 128m
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-frontend:${IMAGE_TAG:-main}
    ports:
      - "${FRONTEND_PORT:-3070}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
