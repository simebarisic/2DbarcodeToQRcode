# Shema portova za sve lokalne Docker aplikacije: web 30xx, API 80xx, baza 54xx (xx = broj aplikacije).
# barcode-to-qr = 70: web 3070 (i s kućne mreže), backend nije izložen (nginx ga proxira).

services:
  backend:
    mem_limit: 1g
    build: ./backend
    environment:
      # Not strictly needed since nginx proxies same-origin in prod,
      # but harmless to keep for direct API access / debugging.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3070}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    mem_limit: 128m
    build: ./frontend
    ports:
      - "3070:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
