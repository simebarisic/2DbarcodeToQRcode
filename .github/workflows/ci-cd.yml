name: CI/CD

# Runs on every push/PR (build+test only). Docker images are only built
# and pushed to GHCR on pushes to main (tagged ":main" + short SHA) and
# on version tags like v1.2.0 (tagged with that semver + ":latest").
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: mvn verify (compile + unit tests)
        working-directory: backend
        run: mvn -B verify

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm ci && build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-publish:
    needs: [backend-test, frontend-build]
    # Only publish images from main/tags - PRs just build+test above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: backend
            image_name: IMAGE_BACKEND
          - context: frontend
            image_name: IMAGE_FRONTEND
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env[matrix.image_name] }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps: upiše novi tag u apps-config (apps/barcode-to-qr/envs/dev), a Argo CD ga deploya na DEV.
  # Pristup apps-configu: GitHub App (varijabla CONFIG_APP_CLIENT_ID + secret CONFIG_APP_PRIVATE_KEY).
  # Dok varijabla ne postoji, job se preskače.
  update-dev:
    name: Novi tag na DEV (apps-config)
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && vars.CONFIG_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: apps-config-barcode-to-qr-dev
      cancel-in-progress: false
    steps:
      - name: Token za apps-config (GitHub App, vrijedi 1 h)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONFIG_APP_PRIVATE_KEY }}
          owner: simebarisic
          repositories: apps-config

      - name: Checkout apps-config
        uses: actions/checkout@v7
        with:
          repository: simebarisic/apps-config
          token: ${{ steps.app-token.outputs.token }}

      - name: Upiši tag i pushaj
        run: |
          TAG="${GITHUB_SHA::7}"   # isti tag koji je build objavio na GHCR
          ./scripts/set-tag.sh barcode-to-qr dev "$TAG"
          if git diff --quiet; then echo "DEV je već na $TAG"; exit 0; fi
          git config user.name "barcode-to-qr-ci"
          git config user.email "barcode-to-qr-ci@users.noreply.github.com"
          git commit -qam "barcode-to-qr: DEV -> $TAG ($GITHUB_SHA)"
          # Ako je netko u međuvremenu pushao u apps-config, povuci i pokušaj ponovno.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
