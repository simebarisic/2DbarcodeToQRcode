# Ingress preko Traefika (ugrađen u k3s/k3d). cert-manager vidi anotaciju,
# sam kreira Certificate i sprema ga u secret "barcode-to-qr-tls".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barcode-to-qr
  annotations:
    cert-manager.io/issuer: "local-ca"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qr.localtest.me
      secretName: barcode-to-qr-tls
  rules:
    - host: qr.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
