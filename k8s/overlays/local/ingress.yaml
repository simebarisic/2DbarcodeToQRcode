# Ingress preko Traefika (ugrađen u k3s/k3d). TLS certifikat u secretu
# "barcode-to-qr-tls" izdaje cert-manager prema certificate.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barcode-to-qr
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qr.localtest.me
      secretName: barcode-to-qr-tls
  rules:
    - host: qr.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
